<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactief Kruiswoordraadsel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div id="top-sticky-wrapper" class="no-print">
        <div id="active-clue-banner">Selecteer een vakje om te starten</div>
    </div>

    <div class="main-wrapper">
        <div class="sidebar no-print">
            <h2>Dashboard</h2>
            <div class="card"><div id="timer">00:00</div></div>
            <div class="card">
                <label>1. Excel Bestand</label>
                <input type="file" id="excelUpload" accept=".xlsx">
                <p id="status">Wacht op lijst...</p>
            </div>
            <div class="card">
                <button class="btn primary" onclick="generatePuzzle()">2. Genereer</button>
                <button class="btn secret" onclick="checkPassword()">🔓 Oplossing tonen</button>
                <button class="btn print" onclick="window.print()">3. PDF / Print</button>
            </div>
            <div id="stats"></div>
        </div>

        <div class="paper">
            <h1 contenteditable="true">Mijn Kruiswoordraadsel</h1>
            
            <div id="grid-wrapper">
                <div id="grid-container"></div>
            </div>

            <div class="clues-section">
                <div class="clue-box">
                    <h3>Horizontaal</h3>
                    <ul id="across-clues"></ul>
                </div>
                <div class="clue-box">
                    <h3>Verticaal</h3>
                    <ul id="down-clues"></ul>
                </div>
            </div>

            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
